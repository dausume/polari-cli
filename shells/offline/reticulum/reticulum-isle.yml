# pol-reticulum on an ISLE (lean polari behind the agent). Same image
# and volume rules as polari-rf-node/docker-compose.reticulum.yml, but on
# the isle-agent-net so prf-isle-backend reaches it by container name
# (RETICULUM_URL=http://pol-reticulum:4285). 4242 published on the host =
# the TCP bearer other isles dial (isle-to-isle over LAN/wifi).
services:
  pol-reticulum:
    image: pol-reticulum:staging
    container_name: pol-reticulum
    restart: unless-stopped
    volumes:
      - pol-reticulum-data:/var/reticulum
    networks: [isle-agent-net]
    ports:
      - "4242:4242"
      - "4285:4285"
    mem_limit: 512m
volumes:
  pol-reticulum-data:
networks:
  isle-agent-net:
    external: true
